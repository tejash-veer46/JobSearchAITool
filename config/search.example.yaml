# What to look for and where. Your own copy is config/search.yaml (created from this
# example on first run, and never committed). Edit that one, then run: npm run cli -- run

filters:
  # Jobs asking for more years than this are rejected before scoring.
  max_required_years: 3
  # Ignore postings older than this many days.
  max_age_days: 30
  # Extra words that make a title relevant / irrelevant (case-insensitive).
  extra_title_keywords: []
  extra_title_excludes: []
  # Include manual-testing roles (scored lower than automation roles).
  include_manual_qa: true

scoring:
  # Score (0-100) a job needs to be staged for applying.
  qualify_threshold: 75
  # Cap on jobs scored per run (limits Claude API spend).
  max_scored_per_run: 60

batch:
  # Jobs prefilled per batch, each in its own tab. You review and submit each tab yourself.
  size: 20
  # Start a batch automatically when the dashboard opens.
  auto_start: true

blacklist_companies:
  # Companies never to apply to, e.g. your current employer. Whole words, case-insensitive.
  []

sources:
  # Public career-board feeds. The slug is the last part of the company's
